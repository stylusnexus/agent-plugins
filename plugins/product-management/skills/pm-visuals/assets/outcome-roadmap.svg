<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<title>Sequence outcomes, then commit to learning</title>
<rect x="0" y="0" width="960" height="540" fill="#FAF9F5" stroke="none"/>
<text x="36" y="31" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#087F78">STYLUS NEXUS  /  PRODUCT WORKSHOP</text>
<text x="36" y="76" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203B3B">Sequence outcomes, then commit to learning</text>
<text x="36" y="99" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#526B69">Now / Next / Later · Horizons express confidence and sequence, not promised delivery dates.</text>
<line x1="36" y1="117" x2="924" y2="117" stroke="#CADBD5" stroke-width="1"/>
<line x1="36" y1="498" x2="924" y2="498" stroke="#CADBD5" stroke-width="1"/>
<text x="36" y="520" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="400" fill="#526B69">Original Stylus Nexus artwork · MIT · Working template: replace prompts with evidence.</text>
<rect x="36" y="140" width="284" height="49" fill="#087F78" stroke="none"/>
<text x="53" y="171" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">NOW</text>
<text x="53" y="219" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#087F78">Act + measure</text>
<text x="53" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#203B3B">Outcome: ___________________</text>
<text x="53" y="296" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#203B3B">Baseline → target: ___________</text>
<text x="53" y="336" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#203B3B">Smallest bet: _______________</text>
<text x="53" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#203B3B">Owner / review: _____________</text>
<line x1="53" y1="420" x2="303" y2="420" stroke="#CADBD5" stroke-width="1"/>
<rect x="338" y="140" width="284" height="49" fill="#087F78" stroke="none"/>
<text x="355" y="171" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">NEXT</text>
<text x="355" y="219" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#087F78">Prepare + validate</text>
<text x="355" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#203B3B">Outcome: ___________________</text>
<text x="355" y="296" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#203B3B">What must be true? __________</text>
<text x="355" y="336" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#203B3B">Evidence to advance: ________</text>
<text x="355" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#203B3B">Dependency: ________________</text>
<line x1="355" y1="420" x2="605" y2="420" stroke="#CADBD5" stroke-width="1"/>
<rect x="640" y="140" width="284" height="49" fill="#087F78" stroke="none"/>
<text x="657" y="171" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">LATER</text>
<text x="657" y="219" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#087F78">Explore + preserve options</text>
<text x="657" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#203B3B">Opportunity: _______________</text>
<text x="657" y="296" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#203B3B">Why it matters: _____________</text>
<text x="657" y="336" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#203B3B">Signal to revisit: ___________</text>
<text x="657" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#203B3B">What we will not promise: ____</text>
<line x1="657" y1="420" x2="907" y2="420" stroke="#CADBD5" stroke-width="1"/>
<text x="53" y="463" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#526B69">Decision at review: continue / change / stop     ·     Link each bet to an outcome and current evidence.</text>
</svg>