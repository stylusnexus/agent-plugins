name: npm-publish
# Publishes @stylusnexus/agent-plugins from CI, so publishing never depends on an
# interactive terminal or a one-time password. Mirrors the approach already used
# by stylusnexus/work-plan-toolkit.
#
# One-time setup:
#   1. npmjs.com -> Access Tokens -> Generate New Token -> Classic -> Automation
#      (Automation tokens are built for CI and are not prompted for an OTP.)
#   2. gh secret set NPM_TOKEN --repo stylusnexus/agent-plugins
#      (paste the token at the prompt so it never lands in a file or a transcript)
#
# Run it from the Actions tab. dry_run is ON by default: it packs and validates
# without publishing, so the first run cannot surprise you.
#
# Publishing only happens from main (the Publish step checks github.ref), and
# every publish carries an npm provenance attestation (--provenance, which needs
# the job's id-token: write).
#
# Next step, owner action: the package exists now, so this can move to trusted
# publishing (OIDC) and drop the token. That needs the owner to add a trusted
# publisher for this repo and workflow on npmjs.com (package -> Settings ->
# Trusted publishing). Once a trusted-publisher run succeeds, delete the
# NPM_TOKEN secret and revoke the token on npmjs.com.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate only — do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: validate · pack · publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # This repository ships markdown, not code — the gates are the test suite.
      - name: Manifests in sync
        run: sh scripts/check-manifest-sync.sh

      - name: Skills loadable
        run: python3 scripts/check-skills.py

      - name: Pack and report contents
        run: |
          npm pack --dry-run
          VER="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          SKILLS="$(find plugins -name SKILL.md | wc -l | tr -d ' ')"
          echo "### $NAME@$VER" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- $SKILLS skills across $(ls plugins | wc -l | tr -d ' ') packs" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse to publish outside main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Publishing runs only from main. This run is on $GITHUB_REF, so nothing was published. Re-run from main, or leave dry_run checked."
          exit 1

      - name: Publish
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: echo "dry_run was true — nothing published. Re-run with dry_run unchecked to publish." >> "$GITHUB_STEP_SUMMARY"
